<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Note · Formwheel</title><meta name="description" content="나만의 하루를 기록하는 Formwheel 전자일기">
<link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#253044;background:#f7f6f3}*{box-sizing:border-box}
body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:17px max(20px,calc((100vw - 1060px)/2));background:#fff;border-bottom:1px solid #e9e6df}
a{color:#5549a2;text-decoration:none}header strong{font-size:18px}header a{font-size:14px}
main{max-width:1060px;margin:30px auto;padding:0 18px}h1{font-size:32px;margin:0 0 7px}p.sub{color:#76808c;margin:0 0 26px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px}.panel{background:white;border:1px solid #e8e6e2;box-shadow:0 10px 30px #28213a09;border-radius:20px;padding:20px}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:#6558b6;color:#fff;font-weight:700}
button.secondary{background:#f1eefb;color:#55499f}button.danger{background:#fff1ef;color:#ad4c44}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b3aafa}
.controls{display:flex;gap:8px;margin:0 0 16px}.controls button{flex:1}input,textarea,select{width:100%;padding:12px;border:1px solid #dedee4;border-radius:11px;background:#fff;color:#2b3040}
.search{margin-bottom:12px}.entries{display:grid;gap:8px;max-height:560px;overflow:auto}.entry{display:block;text-align:left;background:#faf9f7;color:#283146;width:100%;border:1px solid #efede8;padding:12px}
.entry.active{border-color:#8979d0;background:#f0edf9}.entry span{display:block;font-size:12px;color:#7b8090;margin-bottom:5px}.entry b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label{font-size:13px;font-weight:750;display:block;margin-bottom:8px;color:#51556b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.field{margin-bottom:15px}
textarea{min-height:300px;resize:vertical;line-height:1.7}#status{font-size:12px;color:#666f7a;margin-top:10px;min-height:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap} .hint{color:#747e88;font-size:12px;line-height:1.65;margin-top:18px}
.empty{font-size:13px;color:#7a7e8b;text-align:center;padding:24px 8px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.entries{max-height:210px}h1{font-size:27px}header{padding:16px 18px}.fields{grid-template-columns:1fr}}
</style></head><body>
<header><strong>📖 Formwheel <span style="color:#6558b6">Note</span></strong><a href="https://semicolonxss.github.io/Formwheel/">← Hub 돌아가기</a></header>
<main><h1>오늘의 한 페이지 ✨</h1><p class="sub">작은 순간도 오래 남도록. 나만의 전자일기</p><details style="margin:-10px 0 18px;font-size:13px"><summary style="cursor:pointer;font-weight:750">📖 기록 및 백업 사용법</summary><p>새 일기를 만들고 날짜·기분·제목·내용을 적은 뒤 저장하세요. 왼쪽 검색으로 기록을 찾을 수 있어요. 백업을 내려받아 두면 기기 데이터 삭제에 대비할 수 있어요.</p></details>
<div class="layout"><aside class="panel"><div class="controls"><button id="new">+ 새 일기</button><button class="secondary" id="export">백업</button></div>
<input class="search" id="search" type="search" placeholder="제목·내용 검색" aria-label="일기 검색">
<div id="entries" class="entries"></div><p class="hint">🔒 현재 이 기기의 브라우저에만 저장돼요. 다른 기기에서는 보이지 않으며 브라우저 데이터를 삭제하면 사라질 수 있으니 백업하세요. 공용 기기에서는 사용하지 않는 것이 좋아요.</p></aside>
<section class="panel"><div class="fields"><div><label for="date">날짜</label><input id="date" type="date"></div><div><label for="mood">오늘의 기분</label><select id="mood"><option>😊 행복</option><option>😌 평온</option><option>🥰 설렘</option><option>😐 보통</option><option>😔 슬픔</option><option>😣 피곤</option><option>😡 화남</option></select></div></div>
<div class="field"><label for="title">일기 제목</label><input id="title" maxlength="120" placeholder="오늘은 어떤 하루였나요?"></div>
<div class="field"><label for="content">오늘의 이야기</label><textarea id="content" placeholder="오늘 있었던 일, 고마웠던 순간, 내일의 다짐을 자유롭게 적어보세요."></textarea></div>
<div class="actions"><button id="save">💾 일기 저장</button><button id="remove" class="danger">삭제</button><button id="import" class="secondary">백업 가져오기</button><input id="importFile" type="file" accept="application/json" hidden></div><p id="status" role="status" aria-live="polite"></p>
</section></div></main>
<script>
(()=>{'use strict';
const KEY='formwheel-note-v1';const $=id=>document.getElementById(id);
let notes=[],current=null,dirty=false;
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg){$('status').textContent=msg}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(v)?v.filter(n=>n&&typeof n.id==='string'):[]}catch{notes=[];notify('저장된 일기를 읽지 못했어요.')}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch{notify('저장 공간이 부족하거나 사용할 수 없어요. 백업해 주세요.');return false}}
function draw(){const q=$('search').value.trim().toLocaleLowerCase();const list=notes.filter(n=>(n.title+' '+n.content+' '+n.date).toLocaleLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)||b.updated-b.updated);
$('entries').innerHTML=list.length?list.map(n=>'<button class="entry '+(current===n.id?'active':'')+'" data-id="'+escape(n.id)+'"><span>'+escape(n.date)+' · '+escape(n.mood)+'</span><b>'+escape(n.title||'제목 없는 일기')+'</b></button>').join(''):'<p class="empty">아직 일기가 없어요. 오늘부터 기록해 볼까요?</p>'}
function discardOK(){return !dirty||confirm('저장하지 않은 변경사항이 있어요. 이동할까요?')}
function reset(){if(!discardOK())return;current=null;$('date').value=today();$('mood').selectedIndex=0;$('title').value='';$('content').value='';dirty=false;notify('새 일기를 작성해 보세요.');draw()}
function openNote(id){if(!discardOK())return;let n=notes.find(n=>n.id===id);if(!n)return;current=id;$('date').value=n.date;$('title').value=n.title;$('content').value=n.content;$('mood').value=n.mood;dirty=false;notify('기록을 불러왔어요.');draw()}
function save(){let date=$('date').value,title=$('title').value.trim(),content=$('content').value.trim(),mood=$('mood').value;if(!date||(!title&&!content)){notify('날짜와 제목 또는 내용을 입력해 주세요.');return}const old=notes.find(n=>n.id===current),now=Date.now(),n={id:old?.id||crypto.randomUUID(),date,title,content,mood,updated:now};let original=notes.slice();notes=notes.filter(x=>x.id!==n.id).concat(n);if(!persist()){notes=original;return}current=n.id;dirty=false;notify('✓ 이 기기에 저장했어요.');draw()}
$('entries').addEventListener('click',e=>{let b=e.target.closest('button[data-id]');if(b)openNote(b.dataset.id)});
$('new').onclick=reset;$('save').onclick=save;
$('remove').onclick=()=>{if(!current){notify('삭제할 기록을 선택해 주세요.');return}if(!confirm('이 일기를 정말 삭제할까요?'))return;let original=notes.slice();notes=notes.filter(n=>n.id!==current);if(!persist()){notes=original;return}current=null;dirty=false;$('title').value='';$('content').value='';$('date').value=today();notify('일기를 삭제했어요.');draw()};
$('search').addEventListener('input',draw);['date','title','content','mood'].forEach(id=>$(id).addEventListener('input',()=>{dirty=true;notify('작성 중 · 저장 버튼을 눌러 주세요.')}));
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Formwheel_Note',version:1,notes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='formwheel-note-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('백업 파일을 다운로드했어요.')};
$('import').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('백업 파일이 너무 커요.');const data=JSON.parse(await file.text());if(data.app!=='Formwheel_Note'||!Array.isArray(data.notes)||data.notes.length>10000)throw Error('올바른 Formwheel Note 백업이 아니에요.');const imported=data.notes.filter(n=>n&&typeof n.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(n.date)&&typeof n.title==='string'&&typeof n.content==='string'&&typeof n.mood==='string').map(n=>({id:n.id.slice(0,100),date:n.date,title:n.title.slice(0,120),content:n.content.slice(0,100000),mood:n.mood.slice(0,30),updated:Number(n.updated)||0}));if(!discardOK())return;if(!confirm(imported.length+'개 기록을 가져올까요? 같은 ID의 기록은 백업 내용으로 교체됩니다.'))return;const old=notes.slice(),map=new Map(notes.map(n=>[n.id,n]));imported.forEach(n=>map.set(n.id,n));notes=[...map.values()];if(!persist()){notes=old;return}current=null;dirty=false;$('date').value=today();$('mood').selectedIndex=0;$('title').value='';$('content').value='';draw();notify(imported.length+'개 일기를 가져왔어요.')}catch(err){notify(err.message||'백업을 읽지 못했어요.')}finally{e.target.value=''}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
load();$('date').value=today();draw();
})();
</script></body></html>
